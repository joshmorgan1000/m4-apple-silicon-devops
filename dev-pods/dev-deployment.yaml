apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev1
  namespace: jenkins
  labels:
    app: dev1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev1
  template:
    metadata:
      labels:
        app: dev1
    spec:
      containers:
        - name: dev1
          image: localhost:30050/dev-x86:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["tail", "-f", "/dev/null"]
          # Expose port 8080 (just for convenience; container not listening by default)
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared-volume
              mountPath: /mnt/shared
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dev1
  namespace: jenkins
  labels:
    app: dev1
spec:
  selector:
    app: dev1
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
