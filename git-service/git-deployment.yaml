# devops/git-service/git-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-svc
  labels:
    app: git-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-svc
  template:
    metadata:
      labels:
        app: git-svc
    spec:
      containers:
        - name: git-svc
          image: localhost:30050/git-service:latest
          ports:
            - containerPort: 3000
            - containerPort: 22
          volumeMounts:
            - name: git-data
              mountPath: /data
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      volumes:
        - name: git-data
          persistentVolumeClaim:
            claimName: git-service-pvc