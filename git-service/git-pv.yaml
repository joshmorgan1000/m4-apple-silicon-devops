# devops/git-service/git-pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: git-service-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  hostPath:
    path: ${DEVOPS_STORAGE_PATH}/git-service
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-service-pvc
spec:
  storageClassName: local-storage
  volumeName: git-service-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi