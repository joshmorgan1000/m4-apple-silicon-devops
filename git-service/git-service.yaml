# devops/git-service/git-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: git-svc
  labels:
    app: git-svc
spec:
  type: NodePort
  selector:
    app: git-svc
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022